<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="description" content="sf.crash">
<title>sf.crash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
<header class="topbar">
  <div class="brand"><span class="mark">✦</span><span>SF<span class="dim">.CRASH</span></span></div>
  <div class="head-actions"><span id="network-status" class="status"><i></i> ONLINE</span><button id="menu-button" class="menu-button" aria-label="القائمة">•••</button></div>
</header>
<section class="stage">
  <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
  <div class="value"><span id="orb-value">—</span><small>x</small></div>
  <div class="caption">LIVE SESSION</div>
</section>
<section class="connect">
  <input id="session-token" type="password" autocomplete="off" spellcheck="false" placeholder="SESSION KEY" aria-label="رمز الجلسة">
  <button id="connect-button" aria-label="تحقق">↗</button>
</section>
<div id="session-result" class="feedback" role="status"></div>
<section class="history">
  <div class="section-head"><span>RECENT</span><span id="round-count">00</span></div>
  <div id="round-list" class="round-list"><span class="empty">—</span></div>
</section>
<footer><span>SF.CRASH</span><span class="footer-dot"></span><span>SESSION UI</span></footer>
<nav id="drawer" class="drawer hidden" aria-label="القائمة">
  <button data-panel="history">السجل</button>
  <button data-panel="session">رمز الجلسة</button>
  <button id="close-menu">إغلاق</button>
</nav>
<section id="panel" class="panel hidden" role="dialog" aria-modal="true">
  <button id="close-panel" aria-label="إغلاق">×</button>
  <h2 id="panel-title"></h2><div id="panel-content"></div>
</section>
</main>
<script src="app.js"></script>
</body></html>
