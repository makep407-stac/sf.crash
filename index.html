<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070b">
  <title>sf.crash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="splash" class="screen splash">
      <div class="plane-stage"><span class="plane-halo"></span><img class="plane" src="assets/plane.svg" alt=""><span class="plane-trail"></span></div>
      <h1>sf.crash</h1>
      <p class="splash-subtitle">PREMIUM CRASH EXPERIENCE</p>
    </section>
    <section id="login" class="screen hidden">
      <h1>تسجيل الدخول</h1>
      <label for="account-id">معرّف حساب 1xBet</label>
      <input id="account-id" inputmode="numeric" autocomplete="off" placeholder="أدخل المعرّف">
      <label for="app-password">كلمة مرور التطبيق</label>
      <input id="app-password" type="password" autocomplete="current-password" placeholder="كلمة مرور التطبيق">
      <button id="login-button" type="button">دخول</button>
      <p id="login-message" role="status"></p>
    </section>
    <section id="dashboard" class="screen hidden">
      <header><button id="menu-button" aria-label="فتح القائمة">☰</button><strong>sf.crash</strong></header>
      <div class="ash" aria-hidden="true"></div>
      <div class="orb-wrap" aria-label="مؤثر ضوئي"><div class="orb" aria-hidden="true"></div></div>
    </section>
    <nav id="drawer" class="drawer hidden" aria-label="القائمة">
      <button data-panel="sessions">رموز الجلسة</button>
      <button data-panel="history">الجولات المسجلة</button>
      <button data-panel="comparison">مقارنة التنبؤات</button>
      <button id="close-menu">إغلاق</button>
    </nav>
    <section id="panel" class="panel hidden" role="dialog" aria-modal="true">
      <button id="close-panel" aria-label="إغلاق">×</button>
      <h2 id="panel-title"></h2>
      <p id="panel-content"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
